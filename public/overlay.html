<!doctype html>
<html>
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>CHITCHAT OBS Overlay</title>


<style>

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: transparent;

  font-family:
    Arial,
    sans-serif;

}


/* =========================================
   MEME / GIF / VIDEO
========================================= */

#m {

  position: absolute;

  left: 50%;
  top: 8%;

  transform:
    translateX(-50%)
    scale(0.96);

  max-width: 520px;
  max-height: 55%;

  opacity: 0;

  border-radius: 18px;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;

  filter:
    drop-shadow(
      0 12px 30px
      rgba(0, 0, 0, 0.45)
    );

}


#m.show {

  opacity: 1;

  transform:
    translateX(-50%)
    scale(1);

}


/* =========================================
   TEXT ALERT
========================================= */

#t {

  position: absolute;

  left: 50%;
  bottom: 10%;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity: 0;

  max-width: 85%;

  padding:
    16px
    24px;

  color: white;

  text-align: center;

  background:
    rgba(
      10,
      10,
      18,
      0.68
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.16
    );

  border-radius:
    18px;

  box-shadow:
    0 10px 35px
    rgba(
      0,
      0,
      0,
      0.35
    );

  text-shadow:
    0 3px 14px
    black;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;

}


#t.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);

}


#n {

  font-size: 30px;

  font-weight: 900;

}


#msg {

  margin-top: 6px;

  font-size: 24px;

  line-height: 1.3;

}


#amt {

  margin-top: 6px;

  font-size: 20px;

  font-weight: 800;

  color: #d9a6ff;

}

</style>

</head>


<body>


<div id="media"></div>


<div id="t">

  <div id="n"></div>

  <div id="msg"></div>

  <div id="amt"></div>

</div>


<script src="/socket.io/socket.io.js"></script>


<script>

// ======================================================
// CREATOR
// ======================================================

const slug =

  new URLSearchParams(
    window.location.search
  ).get("creator")

  ||

  "ansh";


const socket =
  io();


socket.emit(
  "join-creator",
  slug
);


// ======================================================
// ELEMENTS
// ======================================================

const mediaBox =
  document.getElementById(
    "media"
  );


const alertBox =
  document.getElementById(
    "t"
  );


const nameBox =
  document.getElementById(
    "n"
  );


const messageBox =
  document.getElementById(
    "msg"
  );


const amountBox =
  document.getElementById(
    "amt"
  );


// ======================================================
// QUEUE
// ======================================================

const alertQueue =
  [];


let busy =
  false;


// ======================================================
// SETTINGS
// ======================================================

const MIN_TEXT_VISIBLE_MS =
  4000;


const MAX_AUDIO_MS =
  30000;


const MAX_VIDEO_MS =
  30000;


const IMAGE_DISPLAY_MS =
  5000;


// ======================================================
// WAIT
// ======================================================

function wait(ms) {

  return new Promise(

    resolve =>
      setTimeout(
        resolve,
        ms
      )

  );

}


// ======================================================
// PLAY AUDIO
// ======================================================

function playAudio(
  url,
  maxTime = MAX_AUDIO_MS
) {

  return new Promise(
    resolve => {


      if (!url) {

        resolve();

        return;

      }


      const audio =
        new Audio(url);


      audio.preload =
        "auto";


      audio.volume =
        1;


      let finished =
        false;


      let safetyTimer =
        null;


      function finish() {


        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        if (
          safetyTimer
        ) {

          clearTimeout(
            safetyTimer
          );

        }


        try {

          audio.pause();

        }

        catch (e) {}


        resolve();

      }


      audio.onended =
        finish;


      audio.onerror =
        function(error) {

          console.error(
            "Audio failed:",
            url,
            error
          );

          finish();

        };


      safetyTimer =
        setTimeout(

          finish,

          maxTime

        );


      audio
        .play()

        .catch(
          error => {

            console.error(
              "Audio play blocked/failed:",
              url,
              error
            );

            finish();

          }
        );

    }
  );

}


// ======================================================
// TEXT TO SPEECH
// ======================================================

async function playVoice(
  voiceFile
) {


  if (
    !voiceFile
  ) {

    console.log(
      "No TTS voice file for this alert"
    );

    return;

  }


  /*
    IMPORTANT:

    We wait until the COMPLETE TTS audio
    finishes.

    The instant it ends,
    the soundboard starts.
  */


  await playAudio(
    voiceFile,
    MAX_AUDIO_MS
  );

}


// ======================================================
// SOUNDBOARD
// ======================================================

async function playSound(
  soundFile
) {


  if (
    !soundFile
  ) {

    return;

  }


  /*
    No artificial gap.

    Sound begins immediately
    after TTS finishes.
  */


  await playAudio(
    soundFile,
    MAX_AUDIO_MS
  );

}


// ======================================================
// MEME / GIF / VIDEO
// ======================================================

function showMeme(
  memeFile
) {

  return new Promise(
    resolve => {


      if (
        !memeFile
      ) {

        resolve();

        return;

      }


      mediaBox.innerHTML =
        "";


      const cleanUrl =

        String(
          memeFile
        )

          .split("?")[0];


      const extension =

        cleanUrl

          .split(".")

          .pop()

          .toLowerCase();


      // =========================================
      // IMAGE / GIF
      // =========================================

      if (

        [
          "gif",
          "png",
          "jpg",
          "jpeg",
          "webp"
        ].includes(
          extension
        )

      ) {


        const image =

          document.createElement(
            "img"
          );


        image.src =
          memeFile;


        image.id =
          "m";


        mediaBox.appendChild(
          image
        );


        requestAnimationFrame(

          () => {

            image
              .classList
              .add(
                "show"
              );

          }

        );


        let finished =
          false;


        function finishImage() {


          if (
            finished
          ) {

            return;

          }


          finished =
            true;


          image
            .classList
            .remove(
              "show"
            );


          mediaBox.innerHTML =
            "";


          resolve();

        }


        image.onerror =
          function(error) {

            console.error(
              "Meme image failed:",
              memeFile,
              error
            );

            finishImage();

          };


        /*
          Meme itself stays visible for 5 sec.

          This is NOT a gap.
          This is its display duration.
        */

        setTimeout(

          finishImage,

          IMAGE_DISPLAY_MS

        );


        return;

      }


      // =========================================
      // VIDEO
      // =========================================

      const video =

        document.createElement(
          "video"
        );


      video.src =
        memeFile;


      video.autoplay =
        true;


      video.playsInline =
        true;


      video.muted =
        false;


      video.volume =
        1;


      video.loop =
        false;


      video.id =
        "m";


      mediaBox.appendChild(
        video
      );


      requestAnimationFrame(

        () => {

          video
            .classList
            .add(
              "show"
            );

        }

      );


      let finished =
        false;


      let safetyTimer =
        null;


      function finishVideo() {


        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        if (
          safetyTimer
        ) {

          clearTimeout(
            safetyTimer
          );

        }


        try {

          video.pause();

        }

        catch (e) {}


        video
          .classList
          .remove(
            "show"
          );


        mediaBox.innerHTML =
          "";


        resolve();

      }


      video.onended =
        finishVideo;


      video.onerror =
        function(error) {

          console.error(
            "Meme video failed:",
            memeFile,
            error
          );

          finishVideo();

        };


      safetyTimer =
        setTimeout(

          finishVideo,

          MAX_VIDEO_MS

        );


      video
        .play()

        .catch(
          error => {

            console.error(
              "Video autoplay failed:",
              error
            );

            finishVideo();

          }
        );

    }
  );

}


// ======================================================
// PLAY ONE COMPLETE ALERT
// ======================================================

async function playAlert(
  data
) {


  const alertStartedAt =
    Date.now();


  const viewerName =

    String(
      data.name ||
      "Viewer"
    )

      .trim()

    ||

    "Viewer";


  const viewerMessage =

    String(
      data.message ||
      ""
    )

      .trim();


  const amount =

    Number(
      data.amount ||
      0
    );


  // ====================================================
  // SHOW TEXT
  // ====================================================

  nameBox.textContent =
    viewerName;


  messageBox.textContent =
    viewerMessage;


  amountBox.textContent =

    amount > 0

      ? "₹" +
        amount

      : "";


  alertBox
    .classList
    .add(
      "show"
    );


  /*
    =====================================================
    EXACT SEQUENCE

    1. TTS plays fully

    2. IMMEDIATELY after TTS:
       soundboard

    3. IMMEDIATELY after sound:
       meme

    4. Then next viewer

    NO artificial pause between them.
    =====================================================
  */


  // ====================================================
  // STEP 1 - TTS
  // ====================================================

  await playVoice(
    data.voiceFile
  );


  // ====================================================
  // STEP 2 - SOUNDBOARD
  // ====================================================

  if (
    data.soundFile
  ) {


    await playSound(
      data.soundFile
    );

  }


  // ====================================================
  // STEP 3 - MEME
  // ====================================================

  if (
    data.memeFile
  ) {


    await showMeme(
      data.memeFile
    );

  }


  // ====================================================
  // TEXT MUST STAY AT LEAST 4 SECONDS
  // ====================================================

  const elapsed =

    Date.now()

    -

    alertStartedAt;


  const remainingTextTime =

    MIN_TEXT_VISIBLE_MS

    -

    elapsed;


  /*
    IMPORTANT:

    This does NOT add a gap between:

    TTS -> sound -> meme.

    Those happen immediately.

    This only prevents the text box
    from disappearing in milliseconds.

    Usually TTS + sound/meme itself
    will already be longer than 4 sec,
    so there will be zero extra wait.
  */


  if (
    remainingTextTime >
    0
  ) {


    await wait(
      remainingTextTime
    );

  }


  // ====================================================
  // ALERT FINISHED
  // ====================================================

  alertBox
    .classList
    .remove(
      "show"
    );


  mediaBox.innerHTML =
    "";


  /*
    NO 300ms / 700ms / 1 sec delay.

    Next viewer starts immediately.
  */

}


// ======================================================
// QUEUE PROCESSOR
// ======================================================

async function runQueue() {


  if (
    busy
  ) {

    return;

  }


  busy =
    true;


  while (
    alertQueue.length >
    0
  ) {


    const nextAlert =

      alertQueue.shift();


    try {


      await playAlert(
        nextAlert
      );


    }

    catch (error) {


      console.error(
        "Alert failed:",
        error
      );


      alertBox
        .classList
        .remove(
          "show"
        );


      mediaBox.innerHTML =
        "";

    }

  }


  busy =
    false;

}


// ======================================================
// RECEIVE ALERT
// ======================================================

socket.on(

  "show-alert",

  data => {


    if (
      !data
    ) {

      return;

    }


    if (

      data.creatorSlug !==
      slug

    ) {

      return;

    }


    /*
      Even if 20 people send together:

      alert 1
      ↓
      alert 2
      ↓
      alert 3

      No overlap.
    */


    alertQueue.push(
      data
    );


    runQueue();

  }

);

</script>

</body>

</html>
