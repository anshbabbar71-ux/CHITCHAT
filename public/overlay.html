<!doctype html>
<html>

<head>
<meta charset="utf-8">

<style>

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}


/* MEME / VIDEO */

#m {
  position: absolute;

  left: 50%;
  top: 8%;

  transform:
    translateX(-50%)
    scale(0.96);

  max-width: 520px;
  max-height: 55%;

  opacity: 0;

  transition: 0.25s ease;
}


#m.show {
  opacity: 1;

  transform:
    translateX(-50%)
    scale(1);
}


/* TEXT ALERT */

#t {
  position: absolute;

  left: 50%;
  bottom: 10%;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity: 0;

  color: white;

  text-align: center;

  max-width: 85%;

  padding: 16px 24px;

  border-radius: 18px;

  background:
    rgba(10,10,18,0.65);

  border:
    1px solid
    rgba(255,255,255,0.16);

  box-shadow:
    0 10px 35px
    rgba(0,0,0,0.35);

  text-shadow:
    0 3px 14px black;

  transition:
    0.25s ease;
}


#t.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


#n {
  font-size: 30px;
  font-weight: 900;
}


#msg {
  font-size: 24px;

  margin-top: 6px;
}


#amt {
  font-size: 20px;

  font-weight: 800;

  margin-top: 6px;

  color: #d9a6ff;
}

</style>
</head>


<body>


<div id="media"></div>


<div id="t">

  <div id="n"></div>

  <div id="msg"></div>

  <div id="amt"></div>

</div>



<script src="/socket.io/socket.io.js"></script>


<script>


// ======================================
// CREATOR
// ======================================

const slug =

  new URLSearchParams(
    window.location.search
  ).get("creator")

  ||

  "ansh";


const socket = io();


socket.emit(
  "join-creator",
  slug
);



// ======================================
// HTML ELEMENTS
// ======================================

const mediaBox =
  document.getElementById("media");


const alertBox =
  document.getElementById("t");


const nameBox =
  document.getElementById("n");


const messageBox =
  document.getElementById("msg");


const amountBox =
  document.getElementById("amt");



// ======================================
// ALERT QUEUE
// ======================================

const alertQueue = [];


let busy = false;



function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}



// ======================================
// SPLIT LONG MESSAGE
// ======================================

function splitText(
  text,
  maxLength = 170
) {

  const words =

    String(text || "")

      .trim()

      .split(/\s+/);


  const parts = [];


  let current = "";


  for (
    const word of words
  ) {


    const next =

      current

        ? current + " " + word

        : word;


    if (
      next.length >
      maxLength
    ) {


      if (current) {

        parts.push(
          current
        );

      }


      current =
        word;

    }

    else {

      current =
        next;

    }

  }


  if (current) {

    parts.push(
      current
    );

  }


  return parts;

}



// ======================================
// FREE TEXT TO SPEECH
// ======================================

function playVoicePart(text) {

  return new Promise(
    resolve => {


      if (!text) {

        resolve();

        return;

      }


      /*
        Free Google TTS.

        Testing ke liye.
        API key nahi chahiye.
      */


      const voiceURL =

        "https://translate.google.com/translate_tts"

        +

        "?ie=UTF-8"

        +

        "&client=tw-ob"

        +

        "&tl=en"

        +

        "&q="

        +

        encodeURIComponent(
          text
        );



      const audio =
        new Audio(
          voiceURL
        );


      audio.volume =
        1;



      let finished =
        false;



      function finish() {


        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        try {

          audio.pause();

        }

        catch (e) {}


        resolve();

      }



      audio.onended =
        finish;


      audio.onerror =
        finish;



      /*
        Agar Google voice fail ho,
        queue forever freeze nahi hogi.
      */


      setTimeout(
        finish,
        15000
      );



      audio
        .play()
        .catch(
          finish
        );

    }
  );

}



// ======================================
// SPEAK COMPLETE MESSAGE
// ======================================

async function speak(text) {


  const parts =
    splitText(
      text
    );


  for (
    const part of parts
  ) {


    await playVoicePart(
      part
    );

  }

}



// ======================================
// PLAY SOUNDBOARD
// ======================================

function playSound(
  soundFile
) {

  return new Promise(
    resolve => {


      if (!soundFile) {

        resolve();

        return;

      }


      const audio =
        new Audio(
          soundFile
        );


      let finished =
        false;



      function finish() {


        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        try {

          audio.pause();

        }

        catch (e) {}


        resolve();

      }



      audio.onended =
        finish;


      audio.onerror =
        finish;



      setTimeout(
        finish,
        15000
      );



      audio
        .play()
        .catch(
          finish
        );

    }
  );

}



// ======================================
// SHOW MEME / GIF / VIDEO
// ======================================

function showMeme(
  memeFile
) {

  return new Promise(
    resolve => {


      if (!memeFile) {

        resolve();

        return;

      }



      mediaBox.innerHTML =
        "";



      const cleanURL =

        String(
          memeFile
        )

          .split("?")[0];



      const extension =

        cleanURL

          .split(".")

          .pop()

          .toLowerCase();



      // ==============================
      // IMAGE / GIF
      // ==============================

      if (

        extension === "gif"

        ||

        extension === "png"

        ||

        extension === "jpg"

        ||

        extension === "jpeg"

        ||

        extension === "webp"

      ) {


        const image =

          document.createElement(
            "img"
          );


        image.src =
          memeFile;


        image.id =
          "m";


        mediaBox.appendChild(
          image
        );


        requestAnimationFrame(
          () => {

            image
              .classList
              .add(
                "show"
              );

          }
        );



        setTimeout(
          () => {


            image
              .classList
              .remove(
                "show"
              );


            setTimeout(
              () => {


                mediaBox.innerHTML =
                  "";


                resolve();


              },

              250
            );


          },

          5000
        );


        return;

      }



      // ==============================
      // VIDEO
      // ==============================

      const video =

        document.createElement(
          "video"
        );


      video.src =
        memeFile;


      video.autoplay =
        true;


      video.playsInline =
        true;


      video.loop =
        false;


      video.id =
        "m";


      mediaBox.appendChild(
        video
      );


      requestAnimationFrame(
        () => {

          video
            .classList
            .add(
              "show"
            );

        }
      );



      let finished =
        false;



      function finishVideo() {


        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        try {

          video.pause();

        }

        catch (e) {}


        video
          .classList
          .remove(
            "show"
          );


        setTimeout(
          () => {


            mediaBox.innerHTML =
              "";


            resolve();


          },

          250
        );

      }



      video.onended =
        finishVideo;


      video.onerror =
        finishVideo;



      setTimeout(
        finishVideo,
        12000
      );



      video
        .play()
        .catch(
          finishVideo
        );

    }
  );

}



// ======================================
// ONE COMPLETE ALERT
// ======================================

async function playAlert(
  data
) {


  const viewerName =

    String(
      data.name ||
      "Viewer"
    )

      .trim();



  const viewerMessage =

    String(
      data.message ||
      ""
    )

      .trim();



  const amount =

    Number(
      data.amount ||
      0
    );



  // ==============================
  // SHOW ALERT
  // ==============================

  nameBox.textContent =
    viewerName;


  messageBox.textContent =
    viewerMessage;


  amountBox.textContent =

    amount > 0

      ? "₹" + amount

      : "";


  alertBox
    .classList
    .add(
      "show"
    );



  // ==============================
  // CREATE SUPERCHAT VOICE
  // ==============================

  let voiceText =
    viewerName;



  if (
    amount > 0
  ) {


    voiceText +=

      " sent "

      +

      amount

      +

      " rupees.";


  }

  else {


    voiceText +=

      " sent a message.";

  }



  if (
    viewerMessage
  ) {


    voiceText +=

      " "

      +

      viewerMessage;

  }



  /*
     FINAL ORDER

     1. TEXT READ
     2. SOUNDBOARD
     3. MEME
     4. NEXT VIEWER
  */



  // ==============================
  // 1. TEXT READ
  // ==============================

  await speak(
    voiceText
  );



  // ==============================
  // 2. SOUNDBOARD
  // ==============================

  if (
    data.soundFile
  ) {


    await playSound(
      data.soundFile
    );

  }



  // ==============================
  // 3. MEME
  // ==============================

  if (
    data.memeFile
  ) {


    await showMeme(
      data.memeFile
    );

  }



  // Text-only alert

  if (

    !data.soundFile

    &&

    !data.memeFile

  ) {


    await wait(
      900
    );

  }



  alertBox
    .classList
    .remove(
      "show"
    );


  mediaBox.innerHTML =
    "";


  // Small gap between alerts

  await wait(
    400
  );

}



// ======================================
// QUEUE
// ======================================

async function runQueue() {


  if (
    busy
  ) {

    return;

  }


  busy =
    true;



  while (
    alertQueue.length >
    0
  ) {


    const nextAlert =

      alertQueue.shift();



    try {


      await playAlert(
        nextAlert
      );


    }

    catch (error) {


      console.error(
        "Alert error:",
        error
      );


      alertBox
        .classList
        .remove(
          "show"
        );


      mediaBox.innerHTML =
        "";


      await wait(
        300
      );

    }

  }



  busy =
    false;

}



// ======================================
// RECEIVE FROM SERVER
// ======================================

socket.on(

  "show-alert",

  function(data) {


    if (!data) {

      return;

    }


    if (

      data.creatorSlug !==
      slug

    ) {

      return;

    }



    /*
      ALERT DIRECTLY PLAY
      NAHI HOGA.

      PEHLE QUEUE MEIN.
    */


    alertQueue.push(
      data
    );


    runQueue();

  }

);


</script>


</body>

</html>
