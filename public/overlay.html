<!doctype html>

<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    CHITCHAT OBS Overlay
  </title>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: transparent;

      font-family:
        Arial,
        sans-serif;

    }


    /* =================================
       MEME / VIDEO
    ================================= */


    #m {

      position: absolute;

      left: 50%;

      top: 8%;

      transform:
        translateX(-50%)
        scale(0.96);

      max-width: 520px;

      max-height: 55%;

      opacity: 0;

      transition:
        0.25s ease;

      border-radius:
        18px;

      filter:

        drop-shadow(
          0 12px 30px
          rgba(0,0,0,0.45)
        );

    }


    #m.show {

      opacity: 1;

      transform:
        translateX(-50%)
        scale(1);

    }


    /* =================================
       TEXT ALERT
    ================================= */


    #t {

      position: absolute;

      left: 50%;

      bottom: 10%;

      transform:

        translateX(-50%)

        translateY(20px);


      opacity: 0;


      color: white;


      text-align:
        center;


      max-width:
        85%;


      padding:

        16px

        24px;


      border-radius:
        18px;


      background:

        rgba(
          10,
          10,
          18,
          0.65
        );


      border:

        1px solid

        rgba(
          255,
          255,
          255,
          0.16
        );


      box-shadow:

        0 10px 35px

        rgba(
          0,
          0,
          0,
          0.35
        );


      text-shadow:

        0 3px 14px

        black;


      transition:

        0.25s ease;

    }


    #t.show {

      opacity: 1;

      transform:

        translateX(-50%)

        translateY(0);

    }


    #n {

      font-size:
        30px;

      font-weight:
        900;

    }


    #msg {

      font-size:
        24px;

      margin-top:
        6px;

      line-height:
        1.3;

    }


    #amt {

      font-size:
        20px;

      font-weight:
        800;

      margin-top:
        6px;

      color:
        #d9a6ff;

    }

  </style>

</head>



<body>


  <div id="media"></div>


  <div id="t">

    <div id="n"></div>

    <div id="msg"></div>

    <div id="amt"></div>

  </div>



  <script
    src="/socket.io/socket.io.js"
  ></script>


  <script>


    // =====================================
    // CREATOR
    // =====================================


    const slug =

      new URLSearchParams(

        window.location.search

      ).get(
        "creator"
      )

      ||

      "ansh";



    const socket =
      io();



    socket.emit(

      "join-creator",

      slug

    );



    // =====================================
    // HTML ELEMENTS
    // =====================================


    const mediaBox =

      document.getElementById(
        "media"
      );


    const alertBox =

      document.getElementById(
        "t"
      );


    const nameBox =

      document.getElementById(
        "n"
      );


    const messageBox =

      document.getElementById(
        "msg"
      );


    const amountBox =

      document.getElementById(
        "amt"
      );



    // =====================================
    // ALERT QUEUE
    // =====================================


    const alertQueue =
      [];


    let busy =
      false;



    function wait(ms) {


      return new Promise(

        resolve =>

          setTimeout(

            resolve,

            ms

          )

      );

    }



    // =====================================
    // SPLIT LONG TTS MESSAGE
    // =====================================


    function splitText(

      text,

      maxLength = 160

    ) {


      const words =

        String(
          text ||
          ""
        )

          .trim()

          .split(
            /\s+/
          )

          .filter(
            Boolean
          );



      if (
        !words.length
      ) {

        return [];

      }



      const parts =
        [];


      let current =
        "";



      for (
        const word
        of words
      ) {


        const next =

          current

            ? current +
              " " +
              word

            : word;



        if (

          next.length >
          maxLength

        ) {


          if (
            current
          ) {

            parts.push(
              current
            );

          }



          if (

            word.length >
            maxLength

          ) {


            for (

              let i = 0;

              i < word.length;

              i += maxLength

            ) {


              parts.push(

                word.slice(

                  i,

                  i +
                  maxLength

                )

              );

            }


            current =
              "";

          }

          else {


            current =
              word;

          }

        }

        else {


          current =
            next;

        }

      }



      if (
        current
      ) {

        parts.push(
          current
        );

      }



      return parts;

    }



    // =====================================
    // PLAY ANY AUDIO
    // =====================================


    function playAudioUrl(

      url,

      maxMs = 20000

    ) {


      return new Promise(

        resolve => {


          if (
            !url
          ) {

            resolve();

            return;

          }



          const audio =

            new Audio(
              url
            );


          audio.preload =
            "auto";


          audio.volume =
            1;



          let finished =
            false;


          let safetyTimer =
            null;



          const finish =
            () => {


              if (
                finished
              ) {

                return;

              }


              finished =
                true;



              if (
                safetyTimer
              ) {

                clearTimeout(
                  safetyTimer
                );

              }



              try {


                audio.pause();


                audio.currentTime =
                  0;


              }

              catch (e) {}


              resolve();

            };



          audio.onended =
            finish;


          audio.onerror =
            finish;



          safetyTimer =
            setTimeout(

              finish,

              maxMs

            );



          audio
            .play()

            .catch(
              finish
            );

        }

      );

    }



    // =====================================
    // TEXT TO SPEECH
    // =====================================


    async function speak(
      text
    ) {


      const parts =

        splitText(

          text,

          160

        );



      for (

        const part
        of parts

      ) {


        const voiceUrl =

          "/api/tts?text="

          +

          encodeURIComponent(
            part
          )

          +

          "&_="

          +

          Date.now();



        await playAudioUrl(

          voiceUrl,

          20000

        );

      }

    }



    // =====================================
    // PLAY SOUNDBOARD
    // =====================================


    function playSound(
      soundFile
    ) {


      return playAudioUrl(

        soundFile,

        20000

      );

    }



    // =====================================
    // SHOW MEME / GIF / VIDEO
    // =====================================


    function showMeme(
      memeFile
    ) {


      return new Promise(

        resolve => {


          if (
            !memeFile
          ) {

            resolve();

            return;

          }



          mediaBox.innerHTML =
            "";



          const cleanUrl =

            String(
              memeFile
            )

              .split(
                "?"
              )[0];



          const extension =

            cleanUrl

              .split(
                "."
              )

              .pop()

              .toLowerCase();



          // ==============================
          // IMAGE / GIF
          // ==============================


          if (

            [
              "gif",
              "png",
              "jpg",
              "jpeg",
              "webp"
            ].includes(
              extension
            )

          ) {


            const image =

              document.createElement(
                "img"
              );


            image.src =
              memeFile;


            image.id =
              "m";


            mediaBox.appendChild(
              image
            );



            requestAnimationFrame(

              () => {


                image

                  .classList

                  .add(
                    "show"
                  );

              }

            );



            setTimeout(

              () => {


                image

                  .classList

                  .remove(
                    "show"
                  );



                setTimeout(

                  () => {


                    mediaBox.innerHTML =
                      "";


                    resolve();


                  },

                  250

                );


              },

              5000

            );


            return;

          }



          // ==============================
          // VIDEO MEME
          // ==============================


          const video =

            document.createElement(
              "video"
            );


          video.src =
            memeFile;


          video.autoplay =
            true;


          video.playsInline =
            true;


          video.loop =
            false;


          video.id =
            "m";


          mediaBox.appendChild(
            video
          );



          requestAnimationFrame(

            () => {


              video

                .classList

                .add(
                  "show"
                );

            }

          );



          let finished =
            false;



          function finishVideo() {


            if (
              finished
            ) {

              return;

            }


            finished =
              true;



            try {

              video.pause();

            }

            catch (e) {}



            video

              .classList

              .remove(
                "show"
              );



            setTimeout(

              () => {


                mediaBox.innerHTML =
                  "";


                resolve();


              },

              250

            );

          }



          video.onended =
            finishVideo;


          video.onerror =
            finishVideo;



          setTimeout(

            finishVideo,

            15000

          );



          video
            .play()

            .catch(
              finishVideo
            );

        }

      );

    }



    // =====================================
    // PLAY ONE COMPLETE ALERT
    // =====================================


    async function playAlert(
      data
    ) {


      const viewerName =

        String(

          data.name ||
          "Viewer"

        )

          .trim();



      const viewerMessage =

        String(

          data.message ||
          ""

        )

          .trim();



      const amount =

        Number(

          data.amount ||
          0

        );



      // =================================
      // SHOW TEXT ON OBS
      // =================================


      nameBox.textContent =
        viewerName;


      messageBox.textContent =
        viewerMessage;


      amountBox.textContent =

        amount > 0

          ? "₹" +
            amount

          : "";



      alertBox

        .classList

        .add(
          "show"
        );



      // =================================
      // CREATE TTS SENTENCE
      // =================================


      let voiceText =
        viewerName;



      if (
        amount > 0
      ) {


        voiceText +=

          " sent "

          +

          amount

          +

          " rupees.";


      }

      else {


        voiceText +=

          " sent a message.";

      }



      if (
        viewerMessage
      ) {


        voiceText +=

          " "

          +

          viewerMessage;

      }



      /*
        FINAL ALERT ORDER

        1. NAME + AMOUNT + MESSAGE READ

        2. SOUNDBOARD

        3. MEME / GIF / VIDEO

        4. NEXT VIEWER
      */



      // =================================
      // STEP 1 - READ MESSAGE
      // =================================


      await speak(
        voiceText
      );



      // =================================
      // STEP 2 - SOUNDBOARD
      // =================================


      if (
        data.soundFile
      ) {


        await playSound(

          data.soundFile

        );

      }



      // =================================
      // STEP 3 - MEME
      // =================================


      if (
        data.memeFile
      ) {


        await showMeme(

          data.memeFile

        );

      }



      // =================================
      // TEXT ONLY ALERT EXTRA DISPLAY
      // =================================


      if (

        !data.soundFile

        &&

        !data.memeFile

      ) {


        await wait(
          900
        );

      }



      // =================================
      // HIDE CURRENT ALERT
      // =================================


      alertBox

        .classList

        .remove(
          "show"
        );


      mediaBox.innerHTML =
        "";



      // gap before next viewer

      await wait(
        400
      );

    }



    // =====================================
    // QUEUE PROCESSOR
    // =====================================


    async function runQueue() {


      if (
        busy
      ) {

        return;

      }


      busy =
        true;



      while (

        alertQueue.length >
        0

      ) {


        const nextAlert =

          alertQueue.shift();



        try {


          await playAlert(

            nextAlert

          );


        }

        catch (
          error
        ) {


          console.error(

            "Alert error:",

            error

          );


          alertBox

            .classList

            .remove(
              "show"
            );


          mediaBox.innerHTML =
            "";


          await wait(
            300
          );

        }

      }



      busy =
        false;

    }



    // =====================================
    // RECEIVE ALERT FROM SERVER
    // =====================================


    socket.on(

      "show-alert",

      data => {


        if (
          !data
        ) {

          return;

        }


        if (

          data.creatorSlug !==
          slug

        ) {

          return;

        }



        /*
          NEVER PLAY DIRECTLY.

          EVERY ALERT FIRST GOES
          INTO THE QUEUE.
        */


        alertQueue.push(
          data
        );


        runQueue();

      }

    );


  </script>


</body>

</html>
