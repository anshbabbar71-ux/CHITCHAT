<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}#m{position:absolute;left:50%;top:8%;transform:translateX(-50%);max-width:520px;max-height:55%;opacity:0;transition:.2s}#m.show{opacity:1}#t{position:absolute;left:50%;bottom:10%;transform:translateX(-50%) translateY(20px);opacity:0;color:#fff;text-align:center;text-shadow:0 3px 14px #000;max-width:85%;transition:.2s}#t.show{opacity:1;transform:translateX(-50%) translateY(0)}#n{font-size:30px;font-weight:900}#msg{font-size:24px;margin-top:6px}#amt{font-size:20px;font-weight:800;margin-top:6px}
</style></head><body><div id="media"></div><div id="t"><div id="n"></div><div id="msg"></div><div id="amt"></div></div><script src="/socket.io/socket.io.js"></script><script>
const slug=new URLSearchParams(location.search).get("creator")||"ansh",socket=io();socket.emit("join-creator",slug);let timer;
socket.on("show-alert",d=>{if(d.creatorSlug!==slug)return;clearTimeout(timer);n.textContent=d.name||"";msg.textContent=d.message||"";amt.textContent=d.amount?"₹"+d.amount:"";t.classList.add("show");media.innerHTML="";
if(d.memeFile){let ext=d.memeFile.split(".").pop().toLowerCase(),el;if(ext==="gif"){el=document.createElement("img");el.src=d.memeFile}else{el=document.createElement("video");el.src=d.memeFile;el.autoplay=true;el.playsInline=true;el.loop=false}el.id="m";media.appendChild(el);requestAnimationFrame(()=>el.classList.add("show"))}
if(d.soundFile){let a=new Audio(d.soundFile);a.play().catch(()=>{})}
timer=setTimeout(()=>{t.classList.remove("show");let x=document.getElementById("m");if(x)x.classList.remove("show")},6500)});
</script></body></html>
