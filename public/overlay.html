<!doctype html>
<html>

<head>

<meta charset="utf-8">

<style>

html,
body {

  margin: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;

  background: transparent;

  font-family: Arial, sans-serif;

}


#m {

  position: absolute;

  left: 50%;
  top: 8%;

  transform:
    translateX(-50%)
    scale(.96);

  max-width: 520px;
  max-height: 55%;

  opacity: 0;

  transition: .25s ease;

  border-radius: 18px;

}


#m.show {

  opacity: 1;

  transform:
    translateX(-50%)
    scale(1);

}


#t {

  position: absolute;

  left: 50%;
  bottom: 10%;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity: 0;

  color: white;

  text-align: center;

  max-width: 85%;

  padding: 16px 24px;

  border-radius: 18px;

  background:
    rgba(10,10,18,.65);

  border:
    1px solid
    rgba(255,255,255,.15);

  text-shadow:
    0 3px 14px black;

  transition: .25s ease;

}


#t.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);

}


#n {

  font-size: 30px;

  font-weight: 900;

}


#msg {

  font-size: 24px;

  margin-top: 6px;

}


#amt {

  font-size: 20px;

  font-weight: 800;

  margin-top: 6px;

  color: #d9a6ff;

}

</style>

</head>


<body>


<div id="media"></div>


<div id="t">

  <div id="n"></div>

  <div id="msg"></div>

  <div id="amt"></div>

</div>



<script src="/socket.io/socket.io.js"></script>


<script>


const slug =

  new URLSearchParams(
    location.search
  ).get("creator")

  ||

  "ansh";


const socket = io();


socket.emit(
  "join-creator",
  slug
);



const mediaBox =
  document.getElementById("media");


const alertBox =
  document.getElementById("t");


const nameBox =
  document.getElementById("n");


const messageBox =
  document.getElementById("msg");


const amountBox =
  document.getElementById("amt");



// ========================================
// QUEUE
// ========================================


const queue = [];


let busy = false;



function wait(ms) {

  return new Promise(

    resolve =>
      setTimeout(
        resolve,
        ms
      )

  );

}



// ========================================
// AUDIO PLAYER
// ========================================


function playAudio(
  url,
  maxTime = 20000
) {

  return new Promise(
    resolve => {


      if (!url) {

        resolve();

        return;

      }


      const audio =
        new Audio(url);


      audio.volume =
        1;


      let finished =
        false;


      let timer =
        null;



      function finish() {


        if (finished) {

          return;

        }


        finished =
          true;


        if (timer) {

          clearTimeout(
            timer
          );

        }


        try {

          audio.pause();

        }

        catch (e) {}


        resolve();

      }



      audio.onended =
        finish;


      audio.onerror =
        finish;



      timer =
        setTimeout(

          finish,

          maxTime

        );



      audio
        .play()

        .catch(
          finish
        );

    }
  );

}



// ========================================
// TEXT TO SPEECH
// ========================================


async function speak(text) {


  if (!text) {

    return;

  }


  /*
    TTS server ko max 3 sec dete hain.

    Agar voice server fail hua,
    soundboard/meme block nahi honge.
  */


  const controller =
    new AbortController();


  const timeout =
    setTimeout(

      () => {

        controller.abort();

      },

      3000

    );


  try {


    const response =
      await fetch(

        "/api/tts?text=" +

        encodeURIComponent(
          text.slice(
            0,
            170
          )
        ),

        {

          signal:
            controller.signal,

          cache:
            "no-store"

        }

      );


    clearTimeout(
      timeout
    );


    if (
      !response.ok
    ) {

      return;

    }



    const blob =
      await response.blob();


    if (
      !blob.size
    ) {

      return;

    }



    const audioUrl =
      URL.createObjectURL(
        blob
      );


    try {


      await playAudio(

        audioUrl,

        20000

      );


    }

    finally {


      URL.revokeObjectURL(
        audioUrl
      );

    }


  }

  catch (error) {


    clearTimeout(
      timeout
    );


    console.log(
      "TTS skipped:",
      error.message
    );

  }

}



// ========================================
// SOUNDBOARD
// ========================================


async function playSound(
  soundFile
) {


  if (!soundFile) {

    return;

  }


  await playAudio(

    soundFile,

    20000

  );

}



// ========================================
// MEME / GIF / VIDEO
// ========================================


function showMeme(
  memeFile
) {

  return new Promise(
    resolve => {


      if (!memeFile) {

        resolve();

        return;

      }


      mediaBox.innerHTML =
        "";


      const cleanUrl =

        String(
          memeFile
        )

          .split("?")[0];


      const extension =

        cleanUrl

          .split(".")

          .pop()

          .toLowerCase();



      // IMAGE / GIF

      if (

        [
          "gif",
          "png",
          "jpg",
          "jpeg",
          "webp"
        ].includes(
          extension
        )

      ) {


        const image =

          document.createElement(
            "img"
          );


        image.src =
          memeFile;


        image.id =
          "m";


        mediaBox.appendChild(
          image
        );


        requestAnimationFrame(
          () => {

            image
              .classList
              .add("show");

          }
        );



        image.onerror =
          () => {

            mediaBox.innerHTML =
              "";

            resolve();

          };



        setTimeout(
          () => {


            image
              .classList
              .remove("show");


            setTimeout(
              () => {

                mediaBox.innerHTML =
                  "";

                resolve();

              },

              200

            );


          },

          5000

        );


        return;

      }



      // VIDEO MEME

      const video =

        document.createElement(
          "video"
        );


      video.src =
        memeFile;


      video.autoplay =
        true;


      video.playsInline =
        true;


      video.loop =
        false;


      video.id =
        "m";


      mediaBox.appendChild(
        video
      );


      requestAnimationFrame(
        () => {

          video
            .classList
            .add("show");

        }
      );



      let finished =
        false;



      function finishVideo() {


        if (finished) {

          return;

        }


        finished =
          true;


        try {

          video.pause();

        }

        catch (e) {}


        video
          .classList
          .remove("show");


        mediaBox.innerHTML =
          "";


        resolve();

      }



      video.onended =
        finishVideo;


      video.onerror =
        finishVideo;



      setTimeout(

        finishVideo,

        15000

      );


      video
        .play()

        .catch(
          finishVideo
        );

    }
  );

}



// ========================================
// ONE ALERT
// ========================================


async function playAlert(
  data
) {


  const viewerName =

    String(
      data.name ||
      "Viewer"
    ).trim();



  const viewerMessage =

    String(
      data.message ||
      ""
    ).trim();



  const amount =

    Number(
      data.amount ||
      0
    );



  nameBox.textContent =
    viewerName;


  messageBox.textContent =
    viewerMessage;


  amountBox.textContent =

    amount > 0

      ? "₹" + amount

      : "";



  alertBox
    .classList
    .add("show");



  // =================================
  // VOICE TEXT
  // =================================


  let voiceText =
    viewerName;



  if (
    amount > 0
  ) {


    voiceText +=

      " sent "

      +

      amount

      +

      " rupees.";


  }

  else {


    voiceText +=

      " sent a message.";

  }



  if (
    viewerMessage
  ) {


    voiceText +=

      " "

      +

      viewerMessage;

  }



  /*
      ORDER:

      1. TEXT READ

      2. SOUND

      3. MEME

      4. NEXT VIEWER
  */



  // TEXT READ
  // Fail ho gaya to max 3 sec baad continue.

  await speak(
    voiceText
  );



  // SOUNDBOARD

  if (
    data.soundFile
  ) {


    await playSound(
      data.soundFile
    );

  }



  // MEME

  if (
    data.memeFile
  ) {


    await showMeme(
      data.memeFile
    );

  }



  // text-only alert

  if (

    !data.soundFile

    &&

    !data.memeFile

  ) {


    await wait(
      700
    );

  }



  alertBox
    .classList
    .remove("show");


  mediaBox.innerHTML =
    "";


  await wait(
    300
  );

}



// ========================================
// QUEUE PROCESSOR
// ========================================


async function runQueue() {


  if (busy) {

    return;

  }


  busy =
    true;



  while (
    queue.length
  ) {


    const data =
      queue.shift();


    try {


      await playAlert(
        data
      );


    }

    catch (error) {


      console.error(
        "Alert failed:",
        error
      );


      alertBox
        .classList
        .remove("show");


      mediaBox.innerHTML =
        "";


      await wait(
        200
      );

    }

  }


  busy =
    false;

}



// ========================================
// RECEIVE ALERT
// ========================================


socket.on(

  "show-alert",

  data => {


    if (!data) {

      return;

    }


    if (

      data.creatorSlug !==
      slug

    ) {

      return;

    }


    /*
      SPAM OVERLAP NAHI.

      HAR ALERT LINE MEIN.
    */


    queue.push(
      data
    );


    runQueue();

  }

);


</script>


</body>

</html>
