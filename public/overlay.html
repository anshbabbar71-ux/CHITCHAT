<!doctype html>
<html>

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>CHITCHAT OBS Overlay</title>


<style>

html,
body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: transparent;

  font-family:
    Arial,
    sans-serif;

}


/* =========================================
   MEME / GIF / VIDEO
========================================= */

#m {

  position: absolute;

  left: 50%;

  top: 8%;

  transform:
    translateX(-50%)
    scale(0.96);

  max-width: 520px;

  max-height: 55%;

  opacity: 0;

  transition:
    0.20s ease;

  border-radius:
    18px;

  filter:
    drop-shadow(
      0 12px 30px
      rgba(0,0,0,0.45)
    );

}


#m.show {

  opacity: 1;

  transform:
    translateX(-50%)
    scale(1);

}


/* =========================================
   TEXT ALERT
========================================= */

#t {

  position: absolute;

  left: 50%;

  bottom: 10%;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity: 0;

  color: white;

  text-align: center;

  max-width: 85%;

  padding:
    16px
    24px;

  border-radius:
    18px;

  background:
    rgba(
      10,
      10,
      18,
      0.65
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.15
    );

  box-shadow:
    0 10px 35px
    rgba(
      0,
      0,
      0,
      0.35
    );

  text-shadow:
    0 3px 14px
    black;

  transition:
    0.20s ease;

}


#t.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);

}


#n {

  font-size:
    30px;

  font-weight:
    900;

}


#msg {

  font-size:
    24px;

  margin-top:
    6px;

  line-height:
    1.3;

}


#amt {

  font-size:
    20px;

  font-weight:
    800;

  margin-top:
    6px;

  color:
    #d9a6ff;

}

</style>

</head>


<body>


<div id="media"></div>


<div id="t">

  <div id="n"></div>

  <div id="msg"></div>

  <div id="amt"></div>

</div>



<script src="/socket.io/socket.io.js"></script>


<script>


// ======================================================
// CREATOR
// ======================================================

const slug =

  new URLSearchParams(
    window.location.search
  ).get("creator")

  ||

  "ansh";


const socket =
  io();


socket.emit(
  "join-creator",
  slug
);



// ======================================================
// HTML ELEMENTS
// ======================================================

const mediaBox =
  document.getElementById(
    "media"
  );


const alertBox =
  document.getElementById(
    "t"
  );


const nameBox =
  document.getElementById(
    "n"
  );


const messageBox =
  document.getElementById(
    "msg"
  );


const amountBox =
  document.getElementById(
    "amt"
  );



// ======================================================
// ALERT QUEUE
// ======================================================

const queue =
  [];


let busy =
  false;



// ======================================================
// NORMAL AUDIO PLAYER
// ======================================================

function playAudio(
  url,
  maxTime = 20000
) {

  return new Promise(
    resolve => {


      if (!url) {

        resolve();

        return;

      }


      const audio =
        new Audio(url);


      audio.preload =
        "auto";


      audio.volume =
        1;


      let finished =
        false;


      let safetyTimer =
        null;



      function finish() {


        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        if (
          safetyTimer
        ) {

          clearTimeout(
            safetyTimer
          );

        }


        try {

          audio.pause();

        }

        catch (e) {}


        resolve();

      }



      audio.onended =
        finish;


      audio.onerror =
        finish;



      safetyTimer =
        setTimeout(

          finish,

          maxTime

        );



      audio
        .play()

        .catch(
          error => {

            console.error(
              "Audio play failed:",
              error
            );

            finish();

          }
        );

    }
  );

}



// ======================================================
// TEXT TO SPEECH
// ======================================================

async function speak(
  text
) {


  const cleanText =

    String(
      text ||
      ""
    )

      .replace(
        /\s+/g,
        " "
      )

      .trim()

      .slice(
        0,
        170
      );


  if (
    !cleanText
  ) {

    return;

  }



  /*
    Server se TTS audio mangenge.

    Agar TTS server response hi nahi deta,
    maximum 3 seconds wait hoga.

    IMPORTANT:
    Agar voice successfully start ho gayi,
    hum voice ke COMPLETE hone tak wait karenge.

    Voice finish hote hi soundboard/meme
    IMMEDIATELY start hoga.
  */


  const controller =
    new AbortController();


  const fetchTimeout =
    setTimeout(

      () => {

        controller.abort();

      },

      3000

    );


  try {


    const response =
      await fetch(

        "/api/tts?text="

        +

        encodeURIComponent(
          cleanText
        )

        +

        "&_="

        +

        Date.now(),

        {

          signal:
            controller.signal,

          cache:
            "no-store"

        }

      );


    clearTimeout(
      fetchTimeout
    );


    if (
      !response.ok
    ) {

      console.error(
        "TTS server failed:",
        response.status
      );

      return;

    }



    const blob =
      await response.blob();


    if (
      !blob.size
    ) {

      console.error(
        "TTS returned empty audio"
      );

      return;

    }



    const audioUrl =
      URL.createObjectURL(
        blob
      );


    try {


      /*
        WAIT UNTIL TTS VOICE ACTUALLY ENDS.
      */

      await playAudio(

        audioUrl,

        20000

      );


    }

    finally {


      URL.revokeObjectURL(
        audioUrl
      );

    }


  }

  catch (error) {


    clearTimeout(
      fetchTimeout
    );


    console.error(
      "TTS skipped:",
      error
    );

  }

}



// ======================================================
// SOUNDBOARD
// ======================================================

async function playSound(
  soundFile
) {


  if (
    !soundFile
  ) {

    return;

  }


  /*
    Sound jitna long hai,
    next step uske complete hone ke baad hi.
  */


  await playAudio(

    soundFile,

    20000

  );

}



// ======================================================
// MEME / GIF / VIDEO
// ======================================================

function showMeme(
  memeFile
) {

  return new Promise(
    resolve => {


      if (
        !memeFile
      ) {

        resolve();

        return;

      }


      mediaBox.innerHTML =
        "";


      const cleanUrl =

        String(
          memeFile
        )

          .split("?")[0];


      const extension =

        cleanUrl

          .split(".")

          .pop()

          .toLowerCase();



      // =========================================
      // IMAGE / GIF
      // =========================================

      if (

        [
          "gif",
          "png",
          "jpg",
          "jpeg",
          "webp"
        ].includes(
          extension
        )

      ) {


        const image =

          document.createElement(
            "img"
          );


        image.src =
          memeFile;


        image.id =
          "m";


        mediaBox.appendChild(
          image
        );



        requestAnimationFrame(

          () => {

            image
              .classList
              .add(
                "show"
              );

          }

        );



        let finished =
          false;



        function finishImage() {


          if (
            finished
          ) {

            return;

          }


          finished =
            true;


          image
            .classList
            .remove(
              "show"
            );


          mediaBox.innerHTML =
            "";


          resolve();

        }



        image.onerror =
          finishImage;



        /*
          GIF/image 5 sec display.

          Ye "gap" nahi hai.
          Ye meme ka actual display duration hai.
        */

        setTimeout(

          finishImage,

          5000

        );


        return;

      }



      // =========================================
      // VIDEO MEME
      // =========================================

      const video =

        document.createElement(
          "video"
        );


      video.src =
        memeFile;


      video.autoplay =
        true;


      video.playsInline =
        true;


      video.loop =
        false;


      video.id =
        "m";


      mediaBox.appendChild(
        video
      );



      requestAnimationFrame(

        () => {

          video
            .classList
            .add(
              "show"
            );

        }

      );



      let finished =
        false;



      function finishVideo() {


        if (
          finished
        ) {

          return;

        }


        finished =
          true;


        try {

          video.pause();

        }

        catch (e) {}


        video
          .classList
          .remove(
            "show"
          );


        mediaBox.innerHTML =
          "";


        resolve();

      }



      video.onended =
        finishVideo;


      video.onerror =
        finishVideo;



      /*
        Sirf safety limit.
        Normally video khud end hote hi next step.
      */

      setTimeout(

        finishVideo,

        15000

      );


      video
        .play()

        .catch(
          error => {

            console.error(
              "Meme video failed:",
              error
            );

            finishVideo();

          }
        );

    }
  );

}



// ======================================================
// PLAY ONE COMPLETE ALERT
// ======================================================

async function playAlert(
  data
) {


  const viewerName =

    String(
      data.name ||
      "Viewer"
    )

      .trim();



  const viewerMessage =

    String(
      data.message ||
      ""
    )

      .trim();



  const amount =

    Number(
      data.amount ||
      0
    );



  // =========================================
  // SHOW TEXT ON STREAM
  // =========================================

  nameBox.textContent =
    viewerName;


  messageBox.textContent =
    viewerMessage;


  amountBox.textContent =

    amount > 0

      ? "₹" +
        amount

      : "";


  alertBox
    .classList
    .add(
      "show"
    );



  // =========================================
  // CREATE SUPERCHAT STYLE TTS SENTENCE
  // =========================================

  let voiceText =
    viewerName;



  if (
    amount > 0
  ) {


    voiceText +=

      " sent "

      +

      amount

      +

      " rupees.";


  }

  else {


    voiceText +=

      " sent a message.";

  }



  if (
    viewerMessage
  ) {


    voiceText +=

      " "

      +

      viewerMessage;

  }



  /*
    =====================================================
    EXACT ORDER

    1. TTS READS TEXT COMPLETELY

    2. THE INSTANT TTS FINISHES:
       SOUNDBOARD STARTS

    3. THE INSTANT SOUNDBOARD FINISHES:
       MEME STARTS

    4. THE INSTANT MEME FINISHES:
       NEXT VIEWER STARTS

    NO ARTIFICIAL GAP.
    =====================================================
  */



  // =========================================
  // STEP 1 - TEXT TO SPEECH
  // =========================================

  await speak(
    voiceText
  );



  // =========================================
  // STEP 2 - SOUNDBOARD
  // =========================================

  if (
    data.soundFile
  ) {


    await playSound(
      data.soundFile
    );

  }



  // =========================================
  // STEP 3 - MEME
  // =========================================

  if (
    data.memeFile
  ) {


    await showMeme(
      data.memeFile
    );

  }



  // =========================================
  // ALERT COMPLETE
  // =========================================

  alertBox
    .classList
    .remove(
      "show"
    );


  mediaBox.innerHTML =
    "";


  /*
    NO wait() HERE.

    Next viewer immediately.
  */

}



// ======================================================
// QUEUE PROCESSOR
// ======================================================

async function runQueue() {


  if (
    busy
  ) {

    return;

  }


  busy =
    true;



  while (
    queue.length >
    0
  ) {


    const data =
      queue.shift();


    try {


      /*
        Current viewer completely finish hoga
        tabhi loop next viewer pe jayega.
      */

      await playAlert(
        data
      );


    }

    catch (error) {


      console.error(
        "Alert failed:",
        error
      );


      alertBox
        .classList
        .remove(
          "show"
        );


      mediaBox.innerHTML =
        "";

    }

  }


  busy =
    false;

}



// ======================================================
// RECEIVE ALERT FROM SERVER
// ======================================================

socket.on(

  "show-alert",

  data => {


    if (
      !data
    ) {

      return;

    }


    if (

      data.creatorSlug !==
      slug

    ) {

      return;

    }



    /*
      Alert direct play nahi hoga.

      Pehle queue mein jayega.

      Isliye 10 viewers ek saath
      send karein tab bhi overlap nahi.
    */


    queue.push(
      data
    );


    runQueue();

  }

);


</script>


</body>

</html>
