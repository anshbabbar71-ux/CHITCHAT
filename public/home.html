<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamAlert</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0c10;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:50px 18px}.hero{text-align:center;margin-bottom:35px}.hero h1{font-size:48px;margin:0}.hero p{opacity:.7;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#18181e;border:1px solid #303039;border-radius:18px;padding:20px}input{width:100%;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #3b3b44;background:#0e0e12;color:#fff}button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px}.err{min-height:20px;color:#ff9898;font-size:13px}.mini{opacity:.6;font-size:12px}.demo{background:#111116;border-radius:10px;padding:10px;margin-top:12px;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}}</style></head>
<body><div class="wrap"><div class="hero"><h1>StreamAlert 🎮</h1><p>Creator support + paid messages + soundboards + memes + OBS alerts.</p></div><div class="grid">
<div class="card"><h2>Creator Login</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><div id="lerr" class="err"></div><button id="login">LOGIN</button></div>
<div class="card"><h2>Create Creator Account</h2><input id="name" placeholder="Creator / channel name"><input id="slug" placeholder="Unique username e.g. anshgaming"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)"><div id="serr" class="err"></div><button id="signup">SIGN UP</button><p class="mini">Signup ke baad aapka public link automatically banega.</p></div>
</div></div><script>
async function post(url,data){let r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw new Error(j.error||"Error");return j}
login.onclick=async()=>{lerr.textContent="";try{await post("/api/auth/login",{email:le.value,password:lp.value});location="/dashboard.html"}catch(e){lerr.textContent=e.message}}
document.getElementById("signup").onclick=async()=>{
  const errorBox=document.getElementById("serr");
  errorBox.textContent="";

  try{
    await post("/api/auth/signup",{
      displayName:document.getElementById("name").value.trim(),
      slug:document.getElementById("slug").value.trim().toLowerCase(),
      email:document.getElementById("email").value.trim().toLowerCase(),
      password:document.getElementById("pass").value
    });

    location="/dashboard.html";
  }catch(e){
    errorBox.textContent=e.message;
  }
}
</script></body></html>
